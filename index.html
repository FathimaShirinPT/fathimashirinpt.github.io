<!DOCTYPE html>
<html>
<head>
  <title>Your Name - Portfolio</title>

  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #e2e8f0;
      --accent: #38bdf8;
    }

    .light-mode {
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --accent: #2563eb;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: 0.3s;
    }

    header {
      text-align: center;
      padding: 40px 20px;
    }

    .profile {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: var(--accent);
      display: inline-block;
      margin-bottom: 15px;
    }

    h1 {
      margin: 10px 0;
    }

    nav a {
      margin: 0 10px;
      color: var(--accent);
      text-decoration: none;
      font-weight: bold;
    }

    nav {
      margin-top: 15px;
    }

    .toggle {
      position: absolute;
      right: 20px;
      top: 20px;
      cursor: pointer;
      padding: 8px 12px;
      border-radius: 20px;
      background: var(--card);
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    section {
      background: var(--card);
      margin: 20px 0;
      padding: 20px;
      border-radius: 12px;
      transition: 0.3s;
    }

    section:hover {
      transform: translateY(-5px);
    }

    h2 {
      color: var(--accent);
    }

    html {
      scroll-behavior: smooth;
    }
  </style>
</head>

<body>

<div class="toggle" onclick="toggleMode()">🌙 Toggle</div>

<header>
  <div class="profile"></div>
  <h1>Your Name</h1>
  <p>📍 City | ✉️ Email | 📞 Phone</p>

  <nav>
    <a href="#summary">Summary</a>
    <a href="#education">Education</a>
    <a href="#skills">Skills</a>
    <a href="#projects">Projects</a>
    <a href="#experience">Experience</a>
  </nav>
</header>

<div class="container">

  <section id="summary">
    <h2>Professional Summary</h2>
    <p>Your intro goes here.</p>
  </section>

  <section id="education">
    <h2>Education</h2>
    <p><strong>Your Course</strong><br>Your College — Year</p>
  </section>

  <section id="skills">
    <h2>Skills</h2>
    <p>HTML, CSS, JavaScript</p>
  </section>

  <section id="projects">
    <h2>Projects</h2>
    <p><strong>Project Name</strong></p>
    <p>Short description</p>
  </section>

  <section id="experience">
    <h2>Experience</h2>
    <p><strong>Role</strong> — Company</p>
  </section>

</div>

<script>
function toggleMode() {
  document.body.classList.toggle("light-mode");
}
</script>

</body>
</html>
