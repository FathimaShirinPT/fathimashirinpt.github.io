<!DOCTYPE html>
<html>
<head>
  <title>Your Name - Portfolio</title>

  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #e2e8f0;
      --accent: #38bdf8;
    }

    .light-mode {
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --accent: #2563eb;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: 0.3s;
    }

    .toggle {
      position: fixed;
      right: 20px;
      top: 20px;
      cursor: pointer;
      padding: 8px 12px;
      border-radius: 20px;
      background: var(--card);
    }

    header {
      text-align: center;
      padding: 50px 20px;
    }

    .profile {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 15px;
    }

    h1 {
      margin: 10px 0;
    }

    .typing {
      color: var(--accent);
      font-weight: bold;
    }

    nav a {
      margin: 0 10px;
      color: var(--accent);
      text-decoration: none;
      font-weight: bold;
    }

    nav {
      margin-top: 15px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 20px;
    }

    section {
      background: var(--card);
      margin: 20px 0;
      padding: 25px;
      border-radius: 12px;
      transition: 0.3s;
    }

    section:hover {
      transform: translateY(-5px);
    }

    h2 {
      color: var(--accent);
    }

    .projects {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
    }

    .card {
      background: var(--bg);
      padding: 15px;
      border-radius: 10px;
      transition: 0.3s;
    }

    .card:hover {
      transform: scale(1.05);
    }

    .btn {
      display: inline-block;
      margin-top: 15px;
      padding: 10px 15px;
      background: var(--accent);
      color: white;
      border-radius: 6px;
      text-decoration: none;
    }

    html {
      scroll-behavior: smooth;
    }
  </style>
</head>

<body>

<div class="toggle" onclick="toggleMode()">🌙</div>

<header>
  <img src="yourphoto.jpg" class="profile">
  <h1>Your Name</h1>
  <p>I am a <span class="typing" id="typing"></span></p>

  <nav>
    <a href="#summary">Summary</a>
    <a href="#skills">Skills</a>
    <a href="#projects">Projects</a>
  </nav>

  <a href="resume.pdf" class="btn" download>📄 Download Resume</a>
</header>

<div class="container">

  <section id="summary">
    <h2>Professional Summary</h2>
    <p>Your short intro goes here.</p>
  </section>

  <section id="skills">
    <h2>Skills</h2>
    <p>HTML • CSS • JavaScript • Python</p>
  </section>

  <section id="projects">
    <h2>Projects</h2>

    <div class="projects">

      <div class="card">
        <h3>Project 1</h3>
        <p>Short description</p>
      </div>

      <div class="card">
        <h3>Project 2</h3>
        <p>Short description</p>
      </div>

    </div>

  </section>

</div>

<script>
function toggleMode() {
  document.body.classList.toggle("light-mode");
}

// Typing effect
const words = ["Web Developer", "Student", "Tech Enthusiast"];
let i = 0, j = 0, currentWord = "", isDeleting = false;

function type() {
  currentWord = words[i];
  if (isDeleting) {
    document.getElementById("typing").textContent =
      currentWord.substring(0, j--);
  } else {
    document.getElementById("typing").textContent =
      currentWord.substring(0, j++);
  }

  if (!isDeleting && j === currentWord.length) {
    isDeleting = true;
    setTimeout(type, 1000);
    return;
  }

  if (isDeleting && j === 0) {
    isDeleting = false;
    i = (i + 1) % words.length;
  }

  setTimeout(type, isDeleting ? 50 : 100);
}

type();
</script>

</body>
</html>
